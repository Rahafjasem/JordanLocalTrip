<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="" />
    <title>Sign In - Jordan Local Trip</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="signin-page">
    <header class="site-header">
      <div class="container">
        <a class="logo" href="Home.html"><img src="img/logo.jpg" alt="Jordan Local Trip" /></a>
        <nav class="nav" aria-label="Main">
          <a href="Home.html">Home Page</a>
          <a href="Services.html">Our Services</a>
          <a href="contact.html">Contact Us</a>
          <a class="btn-signin" href="signin.html" aria-current="page">Sign in</a>
        </nav>
      </div>
    </header>
    <main class="auth">
      <div class="login-card">
        <h1>Sign In</h1>
        <form id="loginForm" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required />
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
          <button class="btn" type="submit">Sign In</button>
          <p id="loginMessage" role="status" aria-live="polite"></p>
          <div class="login-links">
            <a href="#" data-unavailable>Forgot Password?</a>
            <a href="#" data-unavailable>Create Account</a>
          </div>
        </form>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <p>&copy; 2025 Jordan Local Trip. All rights reserved.</p>
        <p>North Abdoun, Amman, Jordan &middot; <a href="mailto:jordanlocaltrip@gmail.com">jordanlocaltrip@gmail.com</a></p>
      </div>
    </footer>
    <script src="script.js"></script>
  </body>
</html>
